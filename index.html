<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shape-puzzle-captcha/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shape-puzzle-captcha</title>
    <style>
      body {
        font-family: monospace;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: white;
          background-color: black;
        }
      }
    </style>
    <script type="module" crossorigin src="/shape-puzzle-captcha/assets/index-rq3YpJG5.js"></script>
    <link rel="stylesheet" crossorigin href="/shape-puzzle-captcha/assets/index-tn0RQdqM.css">
  </head>
  <body>
    <shape-puzzle-captcha auto-dark="data"></shape-puzzle-captcha>
    <p>solved: <span id="is-solved">false</span></p>
    <script>
      const captchaElem = document.getElementsByTagName(
        "shape-puzzle-captcha",
      )[0];
      const isSolvedElem = document.getElementById("is-solved");
      captchaElem.addEventListener("shapepuzzlecaptchareset", () => {
        isSolvedElem.innerText = "false";
      });
      captchaElem.addEventListener("shapepuzzlecaptchasolved", () => {
        isSolvedElem.innerText = "true";
      });
    </script>
  </body>
</html>
